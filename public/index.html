<style>

.host-only{display:none}.host-only.show{display:block}#hostEnd.host-only.show{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

.cn{background:#fff;color:#333}.cb{background:linear-gradient(135deg,#f8e71c,#f5a623);color:#333}.ca{color:#fff;font-size:9px;text-align:center;line-height:1.1;padding:2px}
.ca.fr{background:linear-gradient(135deg,#74b9ff,#0984e3)}.ca.f3{background:linear-gradient(135deg,#fd79a8,#e84393)}.ca.sf{background:linear-gradient(135deg,#55efc4,#00b894)}
.tg{padding:2px 6px;border-radius:4px;font-size:9px;font-weight:600}.tg.bonus{background:rgba(245,166,35,.2);color:var(--ylw)}.tg.safe{background:rgba(39,174,96,.2);color:var(--grn)}
.tg.status-stayed{background:rgba(39,174,96,.15);color:var(--grn)}.tg.status-busted{background:rgba(231,76,60,.15);color:var(--red)}

.ov{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:100;background:rgba(0,0,0,.85)}.ov h3{font-size:20px}.tl{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.tb{padding:14px 20px;border-radius:var(--r);background:var(--bg2);border:2px solid var(--bg3);color:var(--txt);font-size:15px;cursor:pointer}.tb:hover{border-color:var(--pri)}

.ftit{font-size:28px;font-weight:700;color:var(--ylw)}.bc{font-size:13px}.bc.pos{color:var(--grn)}.bc.neg{color:var(--red)}
.spec-bar{display:none;background:var(--ylw);color:#333;text-align:center;padding:8px;font-weight:700;font-size:14px;position:fixed;top:0;left:0;right:0;z-index:50}.spec-bar.show{display:block}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg3);padding:12px 24px;border-radius:var(--r);z-index:200;display:none;max-width:90%}#toast.show{display:block}
.conn{color:var(--dim);font-size:13px}
.action-float{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;background:rgba(26,26,46,.97);padding:24px 30px;border-radius:20px;box-shadow:0 4px 30px rgba(0,0,0,.7);border:1px solid var(--pri);pointer-events:auto;touch-action:manipulation}.action-float .btn{min-width:110px;padding:16px 28px;font-size:18px;font-weight:700;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.countdown{display:block;text-align:center;margin-bottom:6px;padding:3px 12px;border-radius:10px;background:var(--red);color:#fff;font-size:14px;font-weight:700;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.bottom-row{width:100%;max-width:700px;display:flex;gap:8px;margin-top:8px}.bottom-row .glog{flex:1;min-width:0}.bottom-row .scoreboard{order:-1}
.scoreboard{flex:1;min-width:0;background:var(--bg2);border-radius:var(--r);padding:10px;max-height:160px;overflow-y:auto;font-size:11px}
.scoreboard h4{font-size:11px;color:var(--pri2);margin-bottom:6px}
.sb-row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05)}.sb-row:last-child{border:none}
.sb-name{color:var(--txt);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-score{color:var(--ylw);font-weight:700}.sb-total{color:var(--dim)}
@media(max-width:600px){.bottom-row{flex-direction:column}.scoreboard{width:100%;max-height:100px}}@media(max-width:480px){.aa{display:none!important}}

<script>
(function(){

buildRs();
function renderLobby(){$("roomMax").textContent=roomSize;selRoom=roomSize;$("seatCnt").textContent=seats.length;var ul=$("seatList");ul.innerHTML="";seats.forEach(function(s,i){var li=document.createElement("li");if(i===mySeat)li.classList.add("me");var pre=(s.ai?"\ud83e\udd16 ":"")+(i===hostSeat?"\ud83d\udc51 ":"");li.textContent=pre+s.name;if(isHost()&&i!==hostSeat&&!s.ai){var kb=document.createElement("button");kb.textContent="\u2715";kb.style.cssText="float:right;background:none;border:1px solid var(--red);color:var(--red);border-radius:4px;padding:2px 8px;cursor:pointer;font-size:11px";kb.dataset.idx=i;kb.onclick=function(){send({type:"kick",seat:parseInt(this.dataset.idx,10)})};li.appendChild(kb)}ul.appendChild(li)});var joined=mySeat>=0;$("joinBlock").style.display=joined?"none":"block";var hh=isHost()&&G&&G.phase==="lobby";$("hostLobby").classList.toggle("show",!!hh);$("btnStart").disabled=!joined||seats.length<1}

if(G.phase==="raise"&&mySeat===G.dealer&&!actionSent){aa='<button class="btn bw" id="aRaise">\u52a0\u6ce8 (x'+G.mult+"\u2192x"+G.mult*2+')</button><button class="btn bo" id="aSkip">\u4e0d\u52a0\u6ce8\uff0c\u5f00\u59cb</button>'}
else if(G.phase==="playing"&&G.f3r>0)aa='<span style="color:var(--ylw)">\u7ffb\u4e09\u5f20\u6267\u884c\u4e2d…</span>';

function onState(msg){actionSent=false;G=msg.G;seats=msg.seats||[];roomSize=msg.roomSize||4;hostSeat=msg.hostSeat!=null?msg.hostSeat:0;if(mySeat>=0&&(mySeat>=seats.length||!seats[mySeat]||seats[mySeat].ai))mySeat=-1;selRoom=roomSize;$("roomMax").textContent=roomSize;buildRs();
var waiting=mySeat<0&&G.phase!=="lobby";
if(waiting){showScr("lobby");renderLobby();$("joinBlock").style.display="none";$("waitMsg").style.display="block"}else if(G.phase==="lobby"){showScr("lobby");$("waitMsg").style.display="none";renderLobby()}else if(G.phase==="roundEnd"){showScr("roundEnd");renderRoundEnd();renderGame()}else if(G.phase==="gameEnd"){showScr("gameEnd");renderGameEnd()}else{showScr("game");renderGame()}if(!waiting)renderLobby()}
function cdDesktop(){if(!G||!G.deadline)return"";var s=Math.max(0,Math.ceil((G.deadline-Date.now())/1000));return s>0?' <span class="countdown">'+s+"s</span>":""}
function renderScoreboard(){if(!G||!G.players)return;var sb="";var sorted=G.players.slice().sort(function(a,b){return b.total-a.total||calcLive(b)-calcLive(a)});
sorted.forEach(function(p,i){var live=calcLive(p);sb+='<div class="sb-row"><span class="sb-name">'+(i+1)+". "+esc(p.name)+'</span><span class="sb-score">'+live+'</span><span class="sb-total">(累'+p.total+')</span></div>'});
$("sbBody").innerHTML=sb}
function renderFloat(){var f=$("floatAA");var isMobile=window.innerWidth<=480;
if(!isMobile||!G||G.phase==="roundEnd"||G.phase==="gameEnd"||G.phase==="lobby"||actionSent||G.targetPending){f.style.display="none";return}
var dl=G.deadline?Math.max(0,Math.ceil((G.deadline-Date.now())/1000)):0;var cdHtml=dl>0?'<span class="countdown">'+dl+"s</span>":"";var btns="";
if(G.phase==="raise"&&mySeat===G.dealer){btns='<button class="btn bw" id="fRaise">加注 x'+(G.mult*2)+'</button><button class="btn bo" id="fSkip">不加注</button>'}
else if(G.phase==="playing"&&mySeat===G.cur&&G.players[G.cur].status==="active"&&G.f3r<=0&&!G.targetPending){var cs=G.players[G.cur].hand.length>0;btns='<button class="btn bp" id="fHit">翻牌</button><button class="btn bs" id="fStay">停牌</button>'}
if(btns){f.innerHTML=cdHtml+btns;f.style.display="flex";var fr=$("fRaise");if(fr)fr.ontouchend=fr.onclick=function(e){e.preventDefault();if(actionSent)return;actionSent=true;$("floatAA").style.display="none";send({type:"raise"})};var fk=$("fSkip");if(fk)fk.ontouchend=fk.onclick=function(e){e.preventDefault();if(actionSent)return;actionSent=true;$("floatAA").style.display="none";send({type:"skip"})};var fh=$("fHit");if(fh)fh.ontouchend=fh.onclick=function(e){e.preventDefault();if(actionSent)return;actionSent=true;$("floatAA").style.display="none";send({type:"hit"})};var fs2=$("fStay");if(fs2)fs2.ontouchend=fs2.onclick=function(e){e.preventDefault();if(actionSent)return;actionSent=true;$("floatAA").style.display="none";send({type:"stay"})}}else{f.style.display="none"}}
setInterval(function(){if(G&&G.deadline){var myAction=(G.phase==="raise"&&mySeat===G.dealer)||(G.phase==="playing"&&mySeat===G.cur);renderFloat();if(myAction){var ti2=$("ti");if(ti2){var old=ti2.querySelector(".countdown");var s=Math.max(0,Math.ceil((G.deadline-Date.now())/1000));if(old){old.textContent=s>0?s+"s":""}}}}},1000);
function connect(){var proto=location.protocol==="https:"?"wss:":"ws:";ws=new WebSocket(proto+"//"+location.host);$("connSt").textContent="\u8fde\u63a5\u4e2d…";ws.onopen=function(){$("connSt").textContent="\u5df2\u8fde\u63a5";var sn=localStorage.getItem("flip7name");if(sn)send({type:"rejoin",name:sn})};ws.onclose=function(){$("connSt").textContent="\u5df2\u65ad\u5f00\uff0c3\u79d2\u540e\u91cd\u8fde…";setTimeout(connect,3000)};ws.onmessage=function(ev){var msg;try{msg=JSON.parse(ev.data)}catch(e){return}if(msg.type==="state")onState(msg);else if(msg.type==="seated")mySeat=msg.seat;else if(msg.type==="kicked"){localStorage.removeItem("flip7name");mySeat=-1;toast("你已被房主踢出房间")}else if(msg.type==="info")toast(msg.text)}}
$("btnJoin").onclick=function(){var n=$("nameIn").value.trim();if(!n){toast("\u8bf7\u8f93\u5165\u6635\u79f0");return}send({type:"join",name:n});localStorage.setItem("flip7name",n)};
$("btnStart").onclick=function(){send({type:"start"})};$("btnNext").onclick=function(){send({type:"nextRound"})};$("btnRestart").onclick=function(){send({type:"restart"})};$("btnLobby").onclick=function(){send({type:"backToLobby"})};$("btnRestartG").onclick=function(){send({type:"restart"})};$("btnLobbyG").onclick=function(){send({type:"backToLobby"})};
connect();})();
</script></body></html>
