<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>大话牌</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#050208;font-family:'Noto Sans SC',system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center}

.device{
  width:960px;height:540px;position:relative;overflow:hidden;
  border-radius:14px;border:2px solid #2a1a0a;
  background:linear-gradient(145deg,#0f0818 0%,#1a0e04 30%,#0d0714 60%,#0a0510 100%);
  transform-origin:center center;
}

.exit-btn{
  position:absolute;top:6px;left:8px;z-index:30;
  width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.55);color:#4a2070;font-size:18px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;backdrop-filter:blur(4px);
}
.exit-btn:hover{background:rgba(255,255,255,.85)}

/* ── Top bar ── */
.topbar{
  position:absolute;top:0;left:0;right:0;height:44px;
  display:flex;align-items:center;padding:0 14px 0 44px;z-index:20;
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);
}
.topbar-title{font-size:14px;font-weight:900;color:#4a2070;letter-spacing:.5px}
.topbar-sub{margin-left:10px;font-size:11px;color:#7a5090;font-weight:700}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.req-badge{
  background:linear-gradient(135deg,#651fff,#7c4dff);color:#fff;
  padding:4px 12px;border-radius:20px;font-size:12px;font-weight:900;
  box-shadow:0 2px 8px rgba(101,31,255,.35);
}
.round-info{font-size:11px;color:#6a4090;font-weight:700}

/* ── Table ── */
.table-area{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);
  width:420px;height:260px;
}
.table-surface{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,#6b3fa0 0%,#4a2070 55%,#3a1860 100%);
  border:6px solid #8b5fbf;
  box-shadow:0 8px 32px rgba(74,32,112,.5),inset 0 4px 20px rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  position:relative;
}
.table-center-text{font-size:13px;color:rgba(255,255,255,.5);font-weight:700;text-align:center;line-height:1.5}
.table-played{
  display:flex;gap:6px;align-items:center;justify-content:center;
  min-height:70px;flex-wrap:wrap;padding:0 20px;
}
.played-card{
  width:44px;height:62px;border-radius:6px;
  background:linear-gradient(145deg,#5a3d8a,#3d2566);
  border:2px solid #9b7fd4;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:rgba(255,255,255,.3);
  box-shadow:0 3px 8px rgba(0,0,0,.3);
  transition:transform .4s;
}
.played-card.revealed{
  background:linear-gradient(145deg,#fff,#f0e6ff);
  border-color:#a06cd5;color:#2a1040;
  font-size:16px;font-weight:900;
}
.played-card.revealed.joker{background:linear-gradient(145deg,#ffe082,#ffb300);border-color:#ff8f00}
.declaration-text{
  font-size:12px;color:#fff;font-weight:700;margin-top:6px;
  background:rgba(0,0,0,.25);padding:3px 10px;border-radius:10px;
}

/* ── Players ── */
.player{
  position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:opacity .4s,filter .4s;
}
.player.eliminated{opacity:.45;filter:grayscale(.8)}
.player.active .player-avatar{box-shadow:0 0 0 3px #ffd740,0 0 16px rgba(255,215,64,.6)}
.player-avatar{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,#f5e6ff,#e0c8f0);
  border:2.5px solid #a06cd5;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  position:relative;transition:box-shadow .3s;
}
.player-avatar .skull{
  position:absolute;bottom:-2px;right:-2px;font-size:14px;
  background:#fff;border-radius:50%;width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
}
.player-name{font-size:11px;font-weight:700;color:#4a2070;max-width:90px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-stats{display:flex;gap:6px;font-size:10px;font-weight:700;color:#6a4090}
.stat-pill{
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);
  border-radius:10px;padding:2px 7px;display:flex;align-items:center;gap:3px;
}
.revolver-pill.danger{background:rgba(255,82,82,.2);border-color:#ef5350;color:#c62828}

.player-top{top:48px;left:50%;transform:translateX(-50%)}
.player-left{left:24px;top:50%;transform:translateY(-50%)}
.player-right{right:24px;top:50%;transform:translateY(-50%)}
.player-bottom{bottom:8px;left:50%;transform:translateX(-50%)}

/* ── Human hand ── */
.hand-area{
  position:absolute;bottom:120px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;z-index:10;
}
.hand-card{
  width:56px;height:78px;border-radius:8px;cursor:pointer;
  background:linear-gradient(145deg,#fff,#f0e6ff);
  border:2.5px solid #c9a8df;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;color:#2a1040;
  box-shadow:0 4px 12px rgba(74,32,112,.25);
  transition:transform .15s,border-color .15s,box-shadow .15s;
}
.hand-card .rank{font-size:20px;line-height:1}
.hand-card .suit{font-size:14px;color:#4a2070}
.hand-card.joker{background:linear-gradient(145deg,#ffe082,#ffb300);border-color:#ff8f00}
.hand-card.joker .rank{font-size:24px}
.hand-card:hover{transform:translateY(-8px)}
.hand-card.selected{
  transform:translateY(-14px);
  border-color:#651fff;box-shadow:0 6px 20px rgba(101,31,255,.4);
}

/* ── Action panel ── */
.action-panel{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;z-index:20;
}
.action-panel.hidden{display:none}
.declare-group{display:flex;align-items:center;gap:6px}
.declare-label{font-size:11px;font-weight:700;color:#4a2070}
.declare-input{
  width:48px;height:32px;border-radius:8px;border:2px solid #a06cd5;
  text-align:center;font-size:16px;font-weight:900;color:#4a2070;
  background:rgba(255,255,255,.7);outline:none;
}
.btn{
  padding:8px 18px;border-radius:20px;border:none;cursor:pointer;
  font-size:13px;font-weight:900;font-family:inherit;
  transition:transform .15s,box-shadow .15s;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 16px rgba(0,0,0,.2)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-play{background:linear-gradient(135deg,#651fff,#7c4dff);color:#fff}
.btn-accept{background:linear-gradient(135deg,#43a047,#2e7d32);color:#fff}
.btn-challenge{background:linear-gradient(135deg,#e53935,#c62828);color:#fff}
.btn-back{background:linear-gradient(135deg,#7c4dff,#651fff);color:#fff;padding:10px 28px;font-size:15px}

/* ── Response panel ── */
.response-panel{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;gap:12px;z-index:20;
}
.response-panel.hidden{display:none}
.response-hint{
  position:absolute;bottom:52px;left:50%;transform:translateX(-50%);
  font-size:12px;font-weight:700;color:#4a2070;background:rgba(255,255,255,.6);
  padding:4px 14px;border-radius:12px;white-space:nowrap;
}
.response-hint.hidden{display:none}

/* ── Toast / log ── */
.game-log{
  position:absolute;top:48px;left:50%;transform:translateX(-50%);
  font-size:11px;font-weight:700;color:#fff;
  background:rgba(74,32,112,.75);padding:5px 16px;border-radius:14px;
  z-index:25;opacity:0;transition:opacity .3s;pointer-events:none;
  max-width:80%;text-align:center;
}
.game-log.show{opacity:1}

/* ── Roulette overlay ── */
.roulette-overlay{
  position:absolute;inset:0;background:rgba(26,10,46,.85);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  z-index:50;opacity:0;pointer-events:none;transition:opacity .4s;
}
.roulette-overlay.show{opacity:1;pointer-events:auto}
.roulette-title{font-size:22px;font-weight:900;color:#fff;margin-bottom:16px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.roulette-player{font-size:14px;color:#e8d5f5;font-weight:700;margin-bottom:20px}
.revolver-wrap{position:relative;width:120px;height:120px;margin-bottom:24px}
.revolver{
  font-size:80px;display:block;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));
  transition:transform .1s;
}
.revolver.spinning{animation:spinRevolver .08s linear infinite}
@keyframes spinRevolver{to{transform:rotate(360deg)}}
.revolver.shake{animation:shakeRevolver .5s ease}
@keyframes shakeRevolver{
  0%,100%{transform:translateX(0) rotate(0)}
  20%{transform:translateX(-6px) rotate(-5deg)}
  40%{transform:translateX(6px) rotate(5deg)}
  60%{transform:translateX(-4px) rotate(-3deg)}
  80%{transform:translateX(4px) rotate(3deg)}
}
.roulette-result{
  font-size:28px;font-weight:900;padding:12px 32px;border-radius:16px;
  opacity:0;transform:scale(.5);transition:all .5s cubic-bezier(.34,1.56,.64,1);
}
.roulette-result.show{opacity:1;transform:scale(1)}
.roulette-result.survive{background:linear-gradient(135deg,#43a047,#2e7d32);color:#fff}
.roulette-result.dead{background:linear-gradient(135deg,#e53935,#b71c1c);color:#fff}
.bullet-info{font-size:12px;color:rgba(255,255,255,.7);margin-top:12px;font-weight:700}

/* ── End screen ── */
.end-overlay{
  position:absolute;inset:0;background:rgba(26,10,46,.88);
  display:flex;align-items:center;justify-content:center;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .5s;
}
.end-overlay.show{opacity:1;pointer-events:auto}
.end-card{
  background:linear-gradient(145deg,#f5e6ff,#e0c8f0);
  border:3px solid #a06cd5;border-radius:20px;
  padding:28px 36px;text-align:center;min-width:380px;
  box-shadow:0 12px 40px rgba(74,32,112,.4);
  transform:scale(.8);transition:transform .5s cubic-bezier(.34,1.56,.64,1);
}
.end-overlay.show .end-card{transform:scale(1)}
.end-title{font-size:26px;font-weight:900;color:#4a2070;margin-bottom:6px}
.end-subtitle{font-size:13px;color:#7a5090;font-weight:700;margin-bottom:18px}
.ranking{list-style:none;text-align:left;margin-bottom:18px}
.ranking li{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-radius:10px;margin-bottom:4px;font-size:13px;font-weight:700;color:#4a2070;
}
.ranking li.winner{background:linear-gradient(90deg,rgba(255,215,64,.3),transparent)}
.ranking li.dead{opacity:.5}
.rank-num{width:24px;text-align:center;font-size:16px}
.rank-emoji{font-size:22px}
.rank-name{flex:1}
.rank-status{font-size:11px;color:#7a5090}
.rewards{
  display:flex;justify-content:center;gap:20px;margin-bottom:20px;
  font-size:15px;font-weight:900;color:#4a2070;
}
.reward-item{display:flex;align-items:center;gap:4px}
.reward-positive{color:#2e7d32}
.reward-negative{color:#c62828}

/* ── Bot thinking indicator ── */
.thinking{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:12px;font-weight:700;color:rgba(255,255,255,.8);
  background:rgba(0,0,0,.3);padding:6px 16px;border-radius:12px;
  z-index:10;display:none;
}
.thinking.show{display:block;animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}

/* ── Card flip animation ── */
@keyframes flipReveal{
  0%{transform:rotateY(90deg)}
  100%{transform:rotateY(0)}
}
.played-card.revealing{animation:flipReveal .4s ease}

/* Battle Mode */
.battle-bar{
  position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:25;
  display:none;align-items:center;gap:14px;
  background:linear-gradient(135deg,rgba(230,81,0,.12),rgba(255,152,0,.12));
  border:1.5px solid rgba(230,81,0,.35);
  border-radius:20px;padding:5px 18px;backdrop-filter:blur(4px);
  font-size:12px;font-weight:700;
}
.battle-bar .hp-val{color:#d32f2f}
.battle-bar .crystal-val{color:#7b1fa2}
.battle-bar .consume-val{color:#e65100}
.battle-bar .raise-count{color:#bf360c;font-size:10px}
</style>

<body>
<div class="device" id="device">
  <button class="exit-btn" onclick="location.href='/lobby-design.html'" title="返回酒庄">←</button>
  <div class="topbar">
    <div class="topbar-title">🃏 大话牌</div>
    <div class="topbar-sub" id="gameModeLabel"></div>
    <div class="topbar-right">
      <div class="round-info" id="roundInfo">第 1 局</div>
      <div class="req-badge" id="reqBadge">目标: A♠</div>

  <div class="player player-top" id="player3">

    <div class="player-stats">
      <div class="stat-pill">🃏 <span class="card-count">5</span></div>
      <div class="stat-pill revolver-pill">🔫 <span class="penalty-count">0</span>/3</div>
    </div>
  </div>
  <div class="player player-left" id="player2">
    <div class="player-avatar"><span class="emoji">🐟</span></div>
    <div class="player-name">芒果鱼bot</div>
    <div class="player-stats">
      <div class="stat-pill">🃏 <span class="card-count">5</span></div>
      <div class="stat-pill revolver-pill">🔫 <span class="penalty-count">0</span>/3</div>
    </div>
  </div>
  <div class="player player-right" id="player1">
    <div class="player-avatar"><span class="emoji">🐻</span></div>
    <div class="player-name">布丁熊bot</div>
    <div class="player-stats">
      <div class="stat-pill">🃏 <span class="card-count">5</span></div>
      <div class="stat-pill revolver-pill">🔫 <span class="penalty-count">0</span>/3</div>
    </div>
  </div>

    <div class="player-avatar"><span class="emoji" id="humanEmoji">🐭</span></div>
    <div class="player-name" id="humanName">Player</div>
    <div class="player-stats">

  <div class="hand-area" id="handArea"></div>

  <div class="action-panel hidden" id="playPanel">

      <div class="rewards" id="rewards"></div>

<script>
/* ═══ URL Params ═══ */
const params = new URLSearchParams(location.search);
const myNick = params.get('nick') || 'Player';
const myEmoji = params.get('emoji') || '🐭';
const gameMode = params.get('mode') || 'fun';

const isBattle = gameMode === 'battle';

const battleState = {
  hp: (() => { if (!localStorage.getItem('battle_hp_reset')) { localStorage.setItem('battle_hp','0'); localStorage.setItem('battle_crystals','0'); localStorage.setItem('battle_hp_reset','1'); } return parseInt(localStorage.getItem('battle_hp') || '0'); })(),
  crystals: parseInt(localStorage.getItem('battle_crystals') || '0'),
  entryFee: 10, raiseCount: 0, totalConsumed: 0
};

function initBattle() {
  if (!isBattle) return;
  battleState.totalConsumed = battleState.entryFee;
  battleState.hp -= battleState.entryFee;
  saveBattleData(); updateBattleUI();
  document.getElementById('battleBar').style.display = 'flex';
}
function battleRaise() {
  if (!isBattle) return;
  battleState.raiseCount++;
  battleState.totalConsumed += battleState.entryFee;
  battleState.hp -= battleState.entryFee;
  saveBattleData(); updateBattleUI();
}
function battleSettle(isWinner) {
  if (!isBattle) return {};
  let hpReturn = 0, crystalReward = 0;
  if (isWinner) {
    hpReturn = Math.floor(battleState.totalConsumed * 0.9);
    crystalReward = battleState.totalConsumed;
    battleState.hp += hpReturn;
    battleState.crystals += crystalReward;
  }
  saveBattleData();
  return { totalConsumed: battleState.totalConsumed, hpReturn, crystalReward };
}
function saveBattleData() {
  localStorage.setItem('battle_hp', battleState.hp);
  localStorage.setItem('battle_crystals', battleState.crystals);
}
function updateBattleUI() {
  document.getElementById('hpVal').textContent = battleState.hp;
  document.getElementById('crystalVal').textContent = battleState.crystals;
  document.getElementById('consumeVal').textContent = battleState.totalConsumed;
  document.getElementById('raiseVal').textContent = battleState.raiseCount;
}

const gameName = params.get('game') || '大话牌';

document.getElementById('humanName').textContent = myNick;
document.getElementById('humanEmoji').textContent = myEmoji;
document.getElementById('gameModeLabel').textContent = gameName + (isBattle ? ' · 🔥血拼' : gameMode === 'compete' ? ' · 竞技' : ' · 娱乐');

/* ═══ Constants ═══ */
const SUITS = ['♠','♥','♦','♣'];
const TYPE_LABELS = { A: 'A', K: 'K', Q: 'Q' };
const TYPE_DISPLAY = { A: 'A♠', K: 'K♠', Q: 'Q♠' };
const DECK_COUNTS = { A: 6, K: 6, Q: 6, Joker: 2 };
const BOT_NAMES = ['', '布丁熊bot', '芒果鱼bot', '小狐狸bot'];
const BOT_EMOJIS = ['', '🐻', '🐟', '🦊'];
const COIN_REWARD = 50;

/* ═══ Game State ═══ */
let players = [];
let deck = [];
let requiredType = 'A';
let roundNum = 1;
let currentPlayer = 0;
let selectedCards = [];
let lastPlay = null;
let gamePhase = 'play'; // play | respond | roulette | ended
let knownPlayed = { A: 0, K: 0, Q: 0, Joker: 0 };

function createPlayer(idx, name, emoji, isHuman) {
  return {
    idx, name, emoji, isHuman,
    hand: [],
    alive: true,
    penaltyCount: 0,
    eliminated: false
  };
}

function initPlayers() {
  players = [
    createPlayer(0, myNick, myEmoji, true),
    createPlayer(1, BOT_NAMES[1], BOT_EMOJIS[1], false),
    createPlayer(2, BOT_NAMES[2], BOT_EMOJIS[2], false),
    createPlayer(3, BOT_NAMES[3], BOT_EMOJIS[3], false)
  ];
}

function buildDeck() {
  deck = [];
  for (const type of ['A', 'K', 'Q']) {
    for (let i = 0; i < DECK_COUNTS[type]; i++) {
      deck.push({ type, suit: SUITS[i % 4], id: `${type}-${i}` });
    }
  }
  for (let i = 0; i < DECK_COUNTS.Joker; i++) {
    deck.push({ type: 'Joker', suit: '', id: `Joker-${i}` });
  }
  shuffle(deck);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function countMatching(hand, reqType) {
  return hand.filter(c => c.type === reqType || c.type === 'Joker').length;
}

function cardMatches(card, reqType) {
  return card.type === reqType || card.type === 'Joker';
}

function nextAlive(from) {
  let i = (from + 1) % 4;
  while (!players[i].alive) {
    i = (i + 1) % 4;
    if (i === from) return -1;
  }
  return i;
}

function aliveCount() {
  return players.filter(p => p.alive).length;
}

function getRespondent(playIdx) {
  return nextAlive(playIdx);
}

/* ═══ Round Management ═══ */
function startNewRound() {
  buildDeck();
  requiredType = ['A', 'K', 'Q'][Math.floor(Math.random() * 3)];
  knownPlayed = { A: 0, K: 0, Q: 0, Joker: 0 };

  for (const p of players) {
    if (p.alive) {
      p.hand = deck.splice(0, 5);
    }
  }

  document.getElementById('roundInfo').textContent = `第 ${roundNum} 局`;
  document.getElementById('reqBadge').textContent = `目标: ${TYPE_DISPLAY[requiredType]}`;
  document.getElementById('declareTypeLabel').textContent = `出几张 = 声明几张${TYPE_LABELS[requiredType]}`;

  clearTable();
  updateAllUI();
  showLog(`新一局开始！本轮目标牌: ${TYPE_DISPLAY[requiredType]}`);
}

function checkEmptyHands() {
  const empty = players.filter(p => p.alive && p.hand.length === 0);
  if (empty.length > 0) {
    roundNum++;
    showLog('有玩家出完手牌，重新发牌！');
    setTimeout(() => startNewRound(), 1200);
    return true;
  }
  return false;
}

/* ═══ Play Logic ═══ */
function doPlay(playerIdx, cardIndices, declared) {
  const p = players[playerIdx];
  const played = cardIndices.map(i => p.hand[i]).sort((a, b) => a.id.localeCompare(b.id));
  const indices = [...cardIndices].sort((a, b) => b - a);
  for (const i of indices) p.hand.splice(i, 1);

  lastPlay = {
    playerIdx,
    cards: played,
    declared,
    totalPlayed: played.length
  };

  renderTablePlay(played, declared, p);
  updateAllUI();

  const typeName = TYPE_LABELS[requiredType];
  showLog(`${p.name} 出了 ${played.length} 张牌，声明 ${declared} 张 ${typeName}`);

  gamePhase = 'respond';
  const respondent = getRespondent(playerIdx);
  if (respondent === -1) return;

  currentPlayer = respondent;
  highlightPlayer(respondent);

  if (players[respondent].isHuman) {
    showResponseUI(p);
  } else {
    hideAllPanels();
    botRespond(respondent);
  }
}

function validateDeclaration(cards, declared) {
  const actual = cards.filter(c => cardMatches(c, requiredType)).length;
  return actual === declared;
}

function doAccept(respondentIdx) {
  hideAllPanels();
  showLog(`${players[respondentIdx].name} 选择相信`);
  gamePhase = 'play';
  currentPlayer = respondentIdx;
  highlightPlayer(respondentIdx);
  clearTable();
  lastPlay = null;

  if (players[respondentIdx].isHuman) {
    showPlayUI();
  } else {
    botPlay(respondentIdx);
  }
}

function doChallenge(accuserIdx) {
  hideAllPanels();
  const play = lastPlay;
  const liar = !validateDeclaration(play.cards, play.declared);
  const victimIdx = liar ? play.playerIdx : accuserIdx;

  showLog(`${players[accuserIdx].name} 质疑！开牌验证...`);
  revealCards(play.cards);

  const typeName = TYPE_LABELS[requiredType];
  const actual = play.cards.filter(c => cardMatches(c, requiredType)).length;

  setTimeout(() => {
    if (liar) {
      showLog(`声明 ${play.declared} 张 ${typeName}，实际 ${actual} 张 — ${players[play.playerIdx].name} 说谎了！`);
    } else {
      showLog(`声明 ${play.declared} 张 ${typeName}，实际 ${actual} 张 — ${players[accuserIdx].name} 质疑失败！`);
    }

    for (const c of play.cards) {
      if (c.type === 'Joker') knownPlayed.Joker++;
      else knownPlayed[c.type]++;
    }

    setTimeout(() => doRoulette(victimIdx, accuserIdx), 1000);
  }, 1500);
}

/* ═══ QQ弹轮盘 (3 QQ弹, 1 has grape juice, one shot per penalty) ═══ */
function doRoulette(victimIdx, accuserIdx) {
  gamePhase = 'roulette';
  const p = players[victimIdx];
  p.penaltyCount++;

  const hit = Math.random() < 1/3;

  const overlay = document.getElementById('rouletteOverlay');
  const revolver = document.getElementById('revolverIcon');
  const result = document.getElementById('rouletteResult');
  document.getElementById('roulettePlayer').textContent = `${p.emoji} ${p.name} 扣动扳机...`;
  document.getElementById('bulletInfo').textContent = `第 ${p.penaltyCount} 次开枪（1/3 概率中弹）`;
  result.className = 'roulette-result';
  result.textContent = '';
  overlay.classList.add('show');

  revolver.classList.add('spinning');
  setTimeout(() => {
    revolver.classList.remove('spinning');
    revolver.classList.add('shake');
    setTimeout(() => {
      revolver.classList.remove('shake');
      if (hit) {
        result.textContent = '🍇💥 葡萄汁爆射！出局！';
        result.classList.add('dead', 'show');
        p.alive = false;
        p.eliminated = true;
      } else {
        result.textContent = '💨 空弹！安全继续';
        result.classList.add('survive', 'show');
      }
      updateAllUI();

      setTimeout(() => {
        overlay.classList.remove('show');
        result.classList.remove('show', 'dead', 'survive');
        clearTable();
        lastPlay = null;

        if (aliveCount() <= 1) {
          endGame();
          return;
        }

        roundNum++;
        let starter = victimIdx;
        if (p.eliminated) starter = nextAlive(victimIdx);
        startNewRound();
        gamePhase = 'play';
        currentPlayer = starter;
        highlightPlayer(starter);

        if (players[starter].isHuman) {
          showPlayUI();
        } else {
          botPlay(starter);
        }
      }, 2000);
    }, 800);
  }, 2000);
}

/* ═══ Bot AI ═══ */
function botThinkDelay() {
  return 1000 + Math.random() * 1000;
}

function estimateTruthProbability(play) {
  const p = players[play.playerIdx];
  const declared = play.declared;
  const total = play.totalPlayed;
  const req = requiredType;

  const remainingInDeck = {};
  for (const t of ['A', 'K', 'Q', 'Joker']) {
    remainingInDeck[t] = DECK_COUNTS[t] - knownPlayed[t];
  }

  const cardsUnaccounted = players.filter(pl => pl.alive).reduce((s, pl) => s + pl.hand.length, 0);
  const reqRemaining = remainingInDeck[req] + remainingInDeck.Joker;

  let prob = 0.5;

  if (declared === 0) {
    prob = reqRemaining > 0 ? 0.3 : 0.85;
  } else if (declared > total) {
    prob = 0.05;
  } else {
    const maxPossible = Math.min(total, reqRemaining);
    if (declared > maxPossible) prob = 0.1;
    else {
      const ratio = declared / total;
      if (ratio === 1) prob = 0.35;
      else if (ratio >= 0.66) prob = 0.45;
      else prob = 0.55;

      const handSize = p.hand.length + total;
      if (handSize <= 3 && declared >= 2) prob -= 0.15;

      const seenRatio = knownPlayed[req] / DECK_COUNTS[req];
      if (seenRatio > 0.5) prob -= 0.2;
      if (seenRatio > 0.7) prob -= 0.15;
    }
  }

  return Math.max(0.05, Math.min(0.95, prob));
}

function botPlay(idx) {
  document.getElementById('thinking').classList.add('show');
  setTimeout(() => {
    document.getElementById('thinking').classList.remove('show');
    const p = players[idx];
    const matching = countMatching(p.hand, requiredType);
    const handLen = p.hand.length;
    const maxPlay = Math.min(3, handLen);
    const numCards = Math.max(1, Math.min(maxPlay, matching > 0 ? (Math.random() < 0.6 ? Math.min(matching, maxPlay) : (1 + Math.floor(Math.random() * maxPlay))) : (1 + Math.floor(Math.random() * maxPlay))));

    let cardIndices = [];
    const matchingIndices = p.hand.map((c, i) => cardMatches(c, requiredType) ? i : -1).filter(i => i >= 0);
    const nonMatchingIndices = p.hand.map((c, i) => !cardMatches(c, requiredType) ? i : -1).filter(i => i >= 0);

    const tellTruth = matching > 0 && Math.random() < 0.75;

    if (tellTruth && matching >= numCards) {
      shuffle(matchingIndices);
      cardIndices = matchingIndices.slice(0, numCards);
      const declared = numCards;
      doPlay(idx, cardIndices.sort((a,b)=>a-b), declared);
    } else if (tellTruth && matching > 0) {
      shuffle(matchingIndices);
      shuffle(nonMatchingIndices);
      const useMatch = Math.min(matching, numCards);
      cardIndices = [...matchingIndices.slice(0, useMatch), ...nonMatchingIndices.slice(0, numCards - useMatch)];
      cardIndices = cardIndices.slice(0, numCards);
      const declared = useMatch;
      doPlay(idx, cardIndices.sort((a,b)=>a-b), declared);
    } else {
      const danger = p.penaltyCount / 3;
      const bluffSize = danger > 0.5 ? 1 : (Math.random() < 0.5 ? 1 : Math.min(2, maxPlay));
      const n = Math.min(bluffSize, maxPlay);
      shuffle(nonMatchingIndices.length ? nonMatchingIndices : p.hand.map((_, i) => i));
      cardIndices = (nonMatchingIndices.length ? nonMatchingIndices : p.hand.map((_, i) => i)).slice(0, n);
      if (cardIndices.length === 0) cardIndices = [0];
      const declared = cardIndices.length;
      doPlay(idx, cardIndices.sort((a,b)=>a-b), declared);
    }
  }, botThinkDelay());
}

function botRespond(idx) {
  document.getElementById('thinking').classList.add('show');
  setTimeout(() => {
    document.getElementById('thinking').classList.remove('show');
    const play = lastPlay;
    const p = players[idx];
    let truthProb = estimateTruthProbability(play);

    const selfDanger = p.penaltyCount / 3;
    truthProb += selfDanger * 0.25;

    const myMatching = countMatching(p.hand, requiredType);
    const myHandSize = p.hand.length;
    if (myMatching >= 2) truthProb += 0.1;
    if (myHandSize <= 2) truthProb += 0.08;

    const baseThreshold = 0.28;
    const liarThreshold = baseThreshold - selfDanger * 0.12;

    let challengeChance = truthProb < liarThreshold ? 0.7 : 0;
    if (truthProb < 0.15) challengeChance = 0.85;
    else if (truthProb < liarThreshold) challengeChance = 0.5;
    else if (truthProb < 0.5) challengeChance = 0.12;
    else challengeChance = 0.05;

    if (selfDanger >= 0.66) challengeChance *= 0.4;

    const callLiar = Math.random() < challengeChance;

    if (callLiar) {
      doChallenge(idx);
    } else {
      doAccept(idx);
    }
  }, botThinkDelay());
}

/* ═══ Human UI ═══ */
function showPlayUI() {
  document.getElementById('playPanel').classList.remove('hidden');
  document.getElementById('responsePanel').classList.add('hidden');
  document.getElementById('responseHint').classList.add('hidden');
  document.getElementById('tableHint').textContent = '选择 1-3 张手牌出牌（出几张=声明几张目标牌）';
  selectedCards = [];
  renderHand();
  updatePlayBtn();
}

function showResponseUI(playPlayer) {
  document.getElementById('playPanel').classList.add('hidden');
  document.getElementById('responsePanel').classList.remove('hidden');
  document.getElementById('responseHint').classList.remove('hidden');
  const typeName = TYPE_LABELS[requiredType];
  document.getElementById('responseHint').textContent =
    `${playPlayer.name} 声明出了 ${lastPlay.declared} 张 ${typeName}（共 ${lastPlay.totalPlayed} 张牌）`;
  document.getElementById('tableHint').textContent = '相信还是质疑？';
}

function hideAllPanels() {
  document.getElementById('playPanel').classList.add('hidden');
  document.getElementById('responsePanel').classList.add('hidden');
  document.getElementById('responseHint').classList.add('hidden');
}

function renderHand() {
  const area = document.getElementById('handArea');
  area.innerHTML = '';
  const hand = players[0].hand;
  hand.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'hand-card' + (card.type === 'Joker' ? ' joker' : '') + (selectedCards.includes(i) ? ' selected' : '');
    if (card.type === 'Joker') {
      el.innerHTML = '<span class="rank">🃏</span>';
    } else {
      el.innerHTML = `<span class="rank">${card.type}</span><span class="suit">${card.suit}</span>`;
    }
    el.onclick = () => toggleCard(i);
    area.appendChild(el);
  });
}

function toggleCard(i) {
  const idx = selectedCards.indexOf(i);
  if (idx >= 0) {
    selectedCards.splice(idx, 1);
  } else if (selectedCards.length < 3) {
    selectedCards.push(i);
  }
  selectedCards.sort((a, b) => a - b);
  renderHand();
  updatePlayBtn();
  updateDeclareInput();
}

function updatePlayBtn() {
  const btn = document.getElementById('playBtn');
  btn.disabled = selectedCards.length < 1 || selectedCards.length > 3;
}

function updateDeclareInput() {}

document.getElementById('playBtn').onclick = () => {
  if (selectedCards.length < 1 || selectedCards.length > 3) return;
  const declared = selectedCards.length;
  hideAllPanels();
  doPlay(0, [...selectedCards], declared);
};

document.getElementById('acceptBtn').onclick = () => doAccept(0);
document.getElementById('challengeBtn').onclick = () => doChallenge(0);

/* ═══ Table Rendering ═══ */
function renderTablePlay(cards, declared, player) {
  const area = document.getElementById('tablePlayed');
  area.innerHTML = '';
  cards.forEach(() => {
    const el = document.createElement('div');
    el.className = 'played-card';
    el.textContent = '🂠';
    area.appendChild(el);
  });
  const typeName = TYPE_LABELS[requiredType];
  document.getElementById('declarationText').textContent =
    `${player.emoji} ${player.name}: "${declared} 张 ${typeName}"`;
  document.getElementById('tableHint').textContent = '';
}

function revealCards(cards) {
  const area = document.getElementById('tablePlayed');
  area.innerHTML = '';
  cards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'played-card revealed revealing' + (card.type === 'Joker' ? ' joker' : '');
    setTimeout(() => el.classList.remove('revealing'), 400);
    if (card.type === 'Joker') {
      el.textContent = '🃏';
    } else {
      el.textContent = card.type + card.suit;
    }
    area.appendChild(el);
  });
}

function clearTable() {
  document.getElementById('tablePlayed').innerHTML = '';
  document.getElementById('declarationText').textContent = '';
}

/* ═══ UI Updates ═══ */
function highlightPlayer(idx) {
  for (let i = 0; i < 4; i++) {
    document.getElementById('player' + i).classList.toggle('active', i === idx);
  }
}

function updateAllUI() {
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById('player' + i);
    const p = players[i];
    el.querySelector('.card-count').textContent = p.hand.length;
    el.querySelector('.penalty-count').textContent = p.penaltyCount;
    const rp = el.querySelector('.revolver-pill');
    rp.classList.toggle('danger', p.penaltyCount >= 2);

    el.classList.toggle('eliminated', !p.alive);

    let avatar = el.querySelector('.player-avatar');
    let skull = avatar.querySelector('.skull');
    if (!p.alive && !skull) {
      skull = document.createElement('span');
      skull.className = 'skull';
      skull.textContent = '☠️';
      avatar.appendChild(skull);
    } else if (p.alive && skull) {
      skull.remove();
    }
  }
  if (players[0].alive && gamePhase === 'play' && currentPlayer === 0) {
    renderHand();
  } else if (gamePhase !== 'play' || currentPlayer !== 0) {
    document.getElementById('handArea').innerHTML = '';
  }
}

function showLog(msg) {
  const el = document.getElementById('gameLog');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showLog._t);
  showLog._t = setTimeout(() => el.classList.remove('show'), 3000);
}

/* ═══ End Game ═══ */
function getProfile() {
  try {
    return JSON.parse(localStorage.getItem('flip7_profile') || '{}');
  } catch { return {}; }
}

function saveProfile(prof) {
  localStorage.setItem('flip7_profile', JSON.stringify(prof));
}

function endGame() {
  gamePhase = 'ended';
  hideAllPanels();

  const winner = players.find(p => p.alive) || players[0];
  const humanWon = winner.isHuman;

  const ranking = [...players].sort((a, b) => {
    if (a.alive !== b.alive) return a.alive ? -1 : 1;
    return a.idx - b.idx;
  });

  let starsDelta = 0;
  let coinsDelta = 0;
  if (gameMode === 'compete') {
    const prof = getProfile();
    prof.stars = prof.stars || 0;
    prof.coins = prof.coins || 0;
    if (humanWon) {
      prof.stars += 1;
      starsDelta = 1;
      coinsDelta = COIN_REWARD;
      prof.coins += COIN_REWARD;
    } else {
      const before = prof.stars;
      prof.stars = Math.max(0, prof.stars - 1);
      starsDelta = prof.stars - before;
    }
    saveProfile(prof);
  }

  document.getElementById('endTitle').textContent = humanWon ? '🎉 胜利!' : '😢 失败';
  document.getElementById('endSubtitle').textContent =
    humanWon ? `${winner.emoji} ${winner.name} 是最后的幸存者！` : `${winner.emoji} ${winner.name} 赢得了游戏`;

  const list = document.getElementById('rankingList');
  list.innerHTML = '';
  ranking.forEach((p, i) => {
    const li = document.createElement('li');
    li.className = (p.alive ? 'winner' : 'dead');
    li.innerHTML = `
      <span class="rank-num">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '💀'}</span>
      <span class="rank-emoji">${p.emoji}</span>
      <span class="rank-name">${p.name}</span>
      <span class="rank-status">${p.alive ? '存活' : '出局 ☠️'}</span>
    `;
    list.appendChild(li);
  });

  const rewards = document.getElementById('rewards');
  if (isBattle) {
    const bs = battleSettle(humanWon);
    if (humanWon) {
      rewards.innerHTML = `
        <div class="reward-item reward-positive">❤️ 返还 ${bs.hpReturn} 血量 (消耗${bs.totalConsumed})</div>
        <div class="reward-item reward-positive">🔮 +${bs.crystalReward} 紫晶</div>
        <div class="reward-item">当前: ❤️ ${battleState.hp} · 🔮 ${battleState.crystals}</div>
      `;
    } else {
      rewards.innerHTML = `
        <div class="reward-item reward-negative">❤️ 失去 ${bs.totalConsumed} 血量</div>
        <div class="reward-item">当前: ❤️ ${battleState.hp}</div>
      `;
    }
  } else if (gameMode === 'compete') {
    rewards.innerHTML = `
      <div class="reward-item ${starsDelta >= 0 ? 'reward-positive' : 'reward-negative'}">
        ⭐ ${starsDelta >= 0 ? '+' : ''}${starsDelta} 星
      </div>
      ${coinsDelta > 0 ? `<div class="reward-item reward-positive">🪙 +${coinsDelta} 金币</div>` : ''}
    `;
  } else {
    rewards.innerHTML = '<div class="reward-item">娱乐模式 · 无积分变化</div>';
  }

  document.getElementById('endOverlay').classList.add('show');
}

function returnToLobby(){
  const ranking = [...players].sort((a, b) => {
    if (a.alive !== b.alive) return a.alive ? -1 : 1;
    return a.idx - b.idx;
  });
  const humanPlace = ranking.findIndex(p => p.isHuman) + 1;
  cellarSettlement(humanPlace, players.length, '大话牌');
}

/* ═══ Auto Scale ═══ */
function scaleDevice() {
  const d = document.getElementById('device');
  const s = Math.min(window.innerWidth / 960, window.innerHeight / 540);
  d.style.transform = `scale(${s})`;
}
window.addEventListener('resize', scaleDevice);
window.addEventListener('orientationchange', () => setTimeout(scaleDevice, 200));

/* ═══ Start Game ═══ */
function startGame() {
  initPlayers();
  roundNum = 1;
  currentPlayer = 0;
  gamePhase = 'play';
  startNewRound();
  highlightPlayer(0);
  showPlayUI();
  showLog(`${myNick}，游戏开始！`);
}

startGame();
scaleDevice();
initBattle();
